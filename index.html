<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050814">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="一只可以轻轻转动、落雪，也能放进房间里的小小水晶球。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Snow Globe">
  <meta property="og:description" content="A small winter scene, held still.">
  <meta property="og:image" content="https://eclock2000.github.io/Fay-s_snow_global_v2/assets/preview/og-snow-globe.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <title>Snow Globe</title>
  <link rel="icon" href="./assets/icons/snow-globe.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/models/fay-snow-globe.glb" as="fetch" type="model/gltf-binary" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./vendor/model-viewer/model-viewer.min.js"></script>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="night-sky" aria-hidden="true"></div>

  <main class="gift" id="gift">
    <header class="masthead" aria-label="Snow Globe">
      <span class="masthead-flake" aria-hidden="true">✦</span>
      <h1>SNOW GLOBE</h1>
      <span class="masthead-flake" aria-hidden="true">✦</span>
    </header>

    <section class="object-stage" id="objectStage" aria-labelledby="globeDescription">
      <p id="globeDescription" class="sr-only">
        一只装着滑雪企鹅的水晶球。木质底座上低低刻着“喜欢滑雪的 Fay”。
      </p>

      <svg class="fallback-globe" id="fallbackGlobe" viewBox="0 0 400 480" role="img" aria-hidden="true">
        <defs>
          <radialGradient id="fallbackGlass" cx="34%" cy="22%" r="74%">
            <stop offset="0" stop-color="#dff3ff" stop-opacity=".22"/>
            <stop offset=".43" stop-color="#4a79a9" stop-opacity=".11"/>
            <stop offset="1" stop-color="#071227" stop-opacity=".36"/>
          </radialGradient>
          <linearGradient id="fallbackSnow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#f8fcff"/>
            <stop offset="1" stop-color="#bdcfe0"/>
          </linearGradient>
          <linearGradient id="fallbackWood" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#704631"/>
            <stop offset=".52" stop-color="#4a281e"/>
            <stop offset="1" stop-color="#29140f"/>
          </linearGradient>
          <linearGradient id="fallbackBrass" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#704522"/>
            <stop offset=".5" stop-color="#c18a4b"/>
            <stop offset="1" stop-color="#6d431f"/>
          </linearGradient>
          <clipPath id="fallbackClip">
            <circle cx="200" cy="184" r="142"/>
          </clipPath>
          <path id="fallbackEngravingArc" d="M128 401 Q200 420 272 401"/>
        </defs>

        <g clip-path="url(#fallbackClip)">
          <circle cx="200" cy="184" r="142" fill="url(#fallbackGlass)"/>
          <path d="M34 214 L366 286 L366 346 L34 346 Z" fill="#bed3e3"/>
          <ellipse cx="200" cy="250" rx="166" ry="46" transform="rotate(12 200 250)" fill="url(#fallbackSnow)"/>
          <path d="M74 226 C112 224 137 232 169 244" fill="none" stroke="#9abbd3" stroke-opacity=".32" stroke-width="4" stroke-linecap="round"/>
          <path d="M78 236 C115 233 140 239 172 250" fill="none" stroke="#a9c6d9" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>

          <g transform="translate(171 184) rotate(12)">
            <ellipse cx="0" cy="12" rx="29" ry="43" fill="#273242"/>
            <ellipse cx="0" cy="18" rx="18" ry="29" fill="#e4eaf0"/>
            <circle cx="0" cy="-30" r="25" fill="#303b49"/>
            <path d="M-15 -38 C-6 -50 10 -50 18 -37 C7 -40 -5 -39 -15 -38Z" fill="#f2f4f5"/>
            <ellipse cx="-7" cy="-31" rx="3" ry="4" fill="#111722"/>
            <ellipse cx="8" cy="-31" rx="3" ry="4" fill="#111722"/>
            <path d="M-2 -24 L12 -20 L-2 -16 Z" fill="#c77942"/>
            <path d="M-27 2 Q-44 16 -40 37" fill="none" stroke="#9eb8d3" stroke-width="8" stroke-linecap="round"/>
            <path d="M26 2 Q43 18 40 38" fill="none" stroke="#9eb8d3" stroke-width="8" stroke-linecap="round"/>
            <path d="M-19 53 L12 49" stroke="#af543f" stroke-width="5" stroke-linecap="round"/>
            <path d="M-30 61 L29 53" stroke="#83a9c8" stroke-width="4" stroke-linecap="round"/>
          </g>

          <g class="fallback-wind" fill="none" stroke="#f7fbff" stroke-linecap="round">
            <path d="m259 108-6 14m31 9-8 17m-4 31-6 13m42-35-5 12" stroke-width="3" opacity=".76"/>
            <path d="m235 148-4 9m50 52-4 10m-63-94-3 7" stroke-width="2" opacity=".58"/>
          </g>

        </g>

        <circle cx="200" cy="184" r="142" fill="none" stroke="#bdddf3" stroke-opacity=".4" stroke-width="3"/>
        <ellipse cx="156" cy="89" rx="53" ry="23" transform="rotate(-18 156 89)" fill="#fff" opacity=".12"/>
        <path d="M84 170 C87 102 129 52 192 44" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="4" stroke-linecap="round"/>

        <path d="M148 326 H252 L263 348 H137 Z" fill="url(#fallbackWood)"/>
        <path d="M112 352 Q118 336 139 334 H261 Q282 336 288 352 L300 411 Q303 424 286 430 H114 Q97 424 100 411 Z" fill="url(#fallbackWood)"/>
        <path d="M107 362 H293" stroke="url(#fallbackBrass)" stroke-width="4" opacity=".82"/>
        <rect x="91" y="426" width="218" height="18" rx="9" fill="#21110d"/>
        <path d="M100 427 H300" stroke="url(#fallbackBrass)" stroke-width="3" opacity=".72"/>
        <text fill="#e7bd7c" fill-opacity=".48" font-size="12" letter-spacing="2.1" font-family="ui-serif, Georgia, serif">
          <textPath href="#fallbackEngravingArc" startOffset="50%" text-anchor="middle">喜欢滑雪的 Fay</textPath>
        </text>
      </svg>

      <model-viewer
        id="globeModel"
        class="globe-model"
        src="./assets/models/fay-snow-globe.glb"
        ios-src="./assets/models/fay-snow-globe.usdz"
        alt="装着滑雪企鹅的水晶球，木质底座刻着喜欢滑雪的 Fay"
        loading="eager"
        reveal="auto"
        camera-controls
        disable-pan
        interaction-prompt="none"
        touch-action="pan-y"
        camera-orbit="8deg 75deg 104%"
        camera-target="0m -0.006m 0m"
        min-camera-orbit="auto 58deg 92%"
        max-camera-orbit="auto 98deg 124%"
        field-of-view="28deg"
        min-field-of-view="24deg"
        max-field-of-view="32deg"
        environment-image="neutral"
        tone-mapping="neutral"
        exposure="1.08"
        shadow-intensity=".75"
        shadow-softness="1"
        animation-crossfade-duration="0"
        ar
        ar-modes="quick-look"
        ar-placement="floor"
        ar-scale="fixed"
      ></model-viewer>

      <div class="load-state" id="loadState" role="status" aria-live="polite">
        <span>雪景正在清晰起来</span>
        <span class="load-track" role="progressbar" aria-label="水晶球载入进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <span class="load-fill" id="loadFill"></span>
        </span>
      </div>

    </section>

    <section class="actions" aria-label="水晶球操作">
      <div class="action-row">
        <button class="action-button room-button" id="roomButton" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2.8 20 7.4v9.2L12 21.2 4 16.6V7.4L12 2.8Z"/>
            <path d="m4.3 7.5 7.7 4.4 7.7-4.4M12 21.1v-9.2"/>
          </svg>
          <span id="roomButtonText">放到房间里</span>
        </button>
      </div>
      <p class="gesture-hint">拖动水晶球，看看另一面</p>
      <p class="camera-note" id="cameraNote">会打开 iPhone 相机，把水晶球放到桌面；画面不会上传到这个网页</p>
    </section>
  </main>

  <dialog class="quiet-dialog" id="arDialog" aria-labelledby="arDialogTitle">
    <button class="dialog-close" id="dialogClose" type="button" aria-label="关闭">×</button>
    <div class="dialog-mark" aria-hidden="true">⌁</div>
    <h2 id="arDialogTitle">换到 Safari，就能放到桌面</h2>
    <p id="arDialogText">点右上角的菜单，选择“在 Safari 中打开”，然后再点一次“放到房间里”。</p>
    <div class="dialog-actions">
      <button class="copy-button" id="copyLink" type="button">复制链接</button>
      <a class="quicklook-link" id="quickLookLink" rel="ar" href="./assets/models/fay-snow-globe.usdz">
        <img src="./assets/icons/ar-cube.svg" alt="" aria-hidden="true">
        <span>直接打开</span>
      </a>
    </div>
    <p class="dialog-status" id="dialogStatus" role="status" aria-live="polite"></p>
  </dialog>

</body>
</html>
